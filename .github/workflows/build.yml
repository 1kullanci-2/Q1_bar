name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/ci-release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 gizli kaydı yok; APK geçici anahtarla imzalanır, sürüm yayınlanmaz."
          fi

      - name: APK derle
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Hataları özetle
        if: failure()
        run: |
          {
            echo "## Derleme hataları"
            echo '```'
            grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " build.log | head -20 | while read -r line; do echo "::error::$line"; done || true

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk medya-paneli.apk

      - uses: actions/upload-artifact@v4
        with:
          name: medya-paneli-apk
          path: medya-paneli.apk

      - name: Sürüm yayınla
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v${{ github.run_number }}" medya-paneli.apk \
            --repo "${{ github.repository }}" \
            --title "Sürüm 3.${{ github.run_number }}" \
            --notes "$MSG"
