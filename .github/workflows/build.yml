name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Debug APK derle
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Hataları özetle
        if: failure()
        run: |
          {
            echo "## Derleme hataları"
            echo '```'
            grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " build.log | head -20 | while read -r line; do echo "::error::$line"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: medya-paneli-apk
          path: app/build/outputs/apk/debug/app-debug.apk
